name: Validate CDH records

# Reusable workflow that validates CDH metadata YAML records. Each record is
# checked with the tooling from the release its cdh_schema_version names, so a
# catalog can hold records of mixed versions.
#
# Usage from another repo:
#
#   jobs:
#     validate:
#       uses: CGIAR-Climate-Data-Hub/cdh-metadata-standard/.github/workflows/validate-records.yaml@<tag>
#       with:
#         path: ./metadata-records          # directory or file to validate
#         versions: |                       # optional: release series accepted
#           v0.3
#           v0.4
#         extra-schemas: ./my-extensions    # optional: your own extension schemas
#         profile: ./my-profile.schema.json # optional: your own policy schema
#                                           # (default "cdh"; "" = mechanism only)
#
# Pin the workflow ref to a release tag. It sets the workflow's inputs, not
# the schema version records are checked against.
#
on:
  workflow_call:
    inputs:
      path:
        description: Path (file or directory) in the caller repo to validate.
        required: true
        type: string
      changed-only:
        description: |
          When true, validate only the *.yaml/*.yml files under `path` that the
          PR (or push) added or modified, instead of the whole path. Intended for
          pull_request workflows so an unrelated pre-existing record can't block a
          submission.
        required: false
        default: false
        type: boolean
      versions:
        description: |
          Release series accepted, one per line: a major (v1) or major.minor
          (v0.3). A record whose cdh_schema_version is outside them fails.
          Empty = any release.
        required: false
        default: ""
        type: string
      tooling-ref:
        description: |
          Override: validate every record with this ref (tag, branch, or SHA)
          instead of the release each record names. For testing unreleased
          schemas in this repo or a fork.
        required: false
        default: ""
        type: string
      tooling-repository:
        description: |
          GitHub repo providing the schemas + validator. Override when calling
           from a fork of this repo (set it to the fork's own github.repository)
           so the fork's CI tests its own changes instead of upstream.
        required: false
        default: CGIAR-Climate-Data-Hub/cdh-metadata-standard
        type: string
      extra-schemas:
        description: |
          Path (file or directory) in the caller repo with additional extension
          schemas to register (passed to the validator as --schemas), for
          records that declare extensions not maintained in the CDH repo.
        required: false
        default: ""
        type: string
      profile:
        description: |
          Policy schema to validate against, on top of core + declared
          extensions. "cdh" (default) uses the CDH profile from the tooling
          repo - required for Hub submissions. A path validates against your
          own profile schema in the caller repo. Empty string = no profile
          (mechanism only).
        required: false
        default: cdh
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repo
        uses: actions/checkout@v6
        with:
          # Full history so changed-only can diff the PR/push base against HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate records
        env:
          TARGET: ${{ inputs.path }}
          CHANGED_ONLY: ${{ inputs.changed-only }}
          # base.sha for pull_request, before for push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERSIONS: ${{ inputs.versions }}
          TOOLING_REF: ${{ inputs.tooling-ref }}
          TOOLING_REPO: ${{ inputs.tooling-repository }}
          EXTRA_SCHEMAS: ${{ inputs.extra-schemas }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$CHANGED_ONLY" = "true" ]; then
            files=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- "$TARGET" | grep -E '\.ya?ml$' || true)
          else
            files=$(find "$TARGET" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
          fi
          [ -z "$files" ] && { echo "No records to validate."; exit 0; }

          # Group files by the tooling ref that validates them.
          declare -A groups
          status=0
          while IFS= read -r f; do
            v=$(sed -nE 's/^cdh_schema_version: *["'"'"']?([^"'"'"' ]+).*/\1/p' "$f" | head -1)
            if [ -z "$TOOLING_REF" ] && [ -z "$v" ]; then
              echo "::error file=$f::no cdh_schema_version"; status=1; continue
            fi
            # A series matches as a prefix at a dot: "v1" takes v1.x.y, "v0.3" takes v0.3.y.
            ok=; for s in $VERSIONS; do [[ "$v." == "$s."* ]] && ok=1; done
            if [ -n "$VERSIONS" ] && [ -n "$v" ] && [ -z "$ok" ]; then
              echo "::error file=$f::$v is not an accepted release series ($(echo $VERSIONS))"; status=1; continue
            fi
            ref=${TOOLING_REF:-$v}
            groups[$ref]+="$f"$'\n'
          done <<< "$files"

          for ref in "${!groups[@]}"; do
            echo "::group::Validating with $TOOLING_REPO@$ref"
            dir="_cdh-tooling/$ref"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" fetch -q --depth 1 "https://github.com/$TOOLING_REPO" "$ref"
            git -C "$dir" checkout -q FETCH_HEAD
            npm ci --prefix "$dir" --silent

            flags=()
            [ -n "$EXTRA_SCHEMAS" ] && flags+=(--schemas "$EXTRA_SCHEMAS")
            profile=$PROFILE
            [ "$profile" = "cdh" ] && profile="$dir/spec/schemas/profiles/cdh.schema.json"
            [ -n "$profile" ] && flags+=(--profile "$profile")
            printf '%s' "${groups[$ref]}" | xargs -d '\n' node "$dir/scripts/validate-yaml.js" "${flags[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status
