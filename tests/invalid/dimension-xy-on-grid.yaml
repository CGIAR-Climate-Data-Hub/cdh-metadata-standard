# A grid's horizontal axes come from spatial; x and y dimensions are rejected beside spatial.resolution.
spatial:
  bbox: [33, -5, 42, 5]
  crs: EPSG:4326
  resolution:
    - { type: xy, value: 0.05, unit: degree }
structures:
  - name: main
    dimensions:
      - { name: lon, type: x, description: Longitude., unit: degree }
      - { name: lat, type: y, description: Latitude., unit: degree }
    variables:
      - { name: tmax, description: Maximum temperature. }
