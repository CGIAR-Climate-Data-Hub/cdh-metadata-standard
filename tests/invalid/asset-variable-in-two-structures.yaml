# An asset holds each variable in one structure; flooded is in both structures listed here.
dimensions:
  - { name: time, type: temporal, description: Month., extent: ["2018-01", "2025-12"], step: P1M }
  - { name: season, type: season, description: Rainy season., values: [MAM, OND] }
variables:
  - { name: flooded, description: Flood occurrence. }
structures:
  - { name: monthly, dimensions: [time], variables: [flooded] }
  - { name: seasonal, dimensions: [season], variables: [flooded] }
data:
  - name: primary
    structures: [monthly, seasonal]
    locations:
      - url: https://example.org/data.tif
