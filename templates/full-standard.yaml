# yaml-language-server: $schema=../spec/schemas/profiles/cdh.schema.json
"$schema": https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: "v0.3.0"

# Extensions this record uses (pinned schema URLs).
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/climate/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/classification/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/agriculture/schema.json

# Core Metadata (required)
id: ""
title: ""
description: >
  ""
license: ""
attribution: "" # optional - credit wording a license or source requires; omit if citation suffices
access: public # optional - one of: public | restricted | non-public; omit = public
access_note: > # required when access is restricted or non-public
  ""
# Resource type - one of: dataset | document | software | service
resource_type: ""

#   keywords:
#     - zonal statistics
#     - term: Food security
#       scheme: https://www.eionet.europa.eu/gemet/
#       uri: https://www.eionet.europa.eu/gemet/en/concept/1838
keywords: []
note: > # Optional
  ""

# Contact Metadata (required). List at least one licensor and one maintainer.
contact:
  - name: "" # optional when organization is present; required for person-level contacts
    roles: [licensor] # any of: licensor | producer | processor | point-of-contact | maintainer
    email: ""
    organization: "" # required when name is present; may be used on its own
    url: ""
  - name: ""
    roles: [maintainer]
    email: ""
    organization: ""
    url: ""

# Citation Metadata (citation required unless a doi is provided)
citation:
  title: "" # optional - cite-as title; may differ from the top-level title
  # required - citation order; a person is {family, given}, an organization is {organization}
  authors:
    - family: ""
      given: ""
  date: "" # required - publication date or year
  publisher: "" # optional - data publisher/repository, or journal for articles
  url: "" # optional
doi: "" # conditional - if doi exists (a doi waives the citation requirement)
related_publications: # optional
  - citation:
      title: ""
      authors:
        - family: ""
          given: ""
      date: ""
      publisher: ""
      url: ""
    doi: ""

# metadata record dates (required) - when this record was written / last changed
created: ""
updated: ""

# Version (required) - the source's own label, or "1" when the source does not version.
# previous_version: the version label this release supersedes (same id); omit on a first release.
version: ""
previous_version: ""

# Series (optional - dataset series / product family, e.g. MapSPAM, GLW)
series:
  name: ""
  url: ""

# Funding (optional)
funding:
  - name: ""
    url: ""

# Spatial (conditional - if data has a spatial aspect/will be in STAC)
spatial:
  bbox: [] # [xmin, ymin, xmax, ymax]; or [[...], [...]] for multiple boxes
  geography: [] # vocab/geography.json ids (UN M49), e.g. [world] or [kenya, uganda]
  crs: ""
  geometry_column: "" # conditional - if spatial vector with a geometry column exists
  resolution:
    - type: "" # one of xy, x, y, point, or polygon
      unit: ""
      value:
      label: ""
      reference_system: ""

temporal: # Temporal coverage (conditional). Use `date` for a single instant/period, OR
  # start_date + end_date for a span (end_date: null = open-ended). Any ISO 8601 precision:
  # year (2020), month (2020-06), day, or datetime - precision sets the granularity. Cadence
  # goes on a type: temporal dimension below, not here.
  date: "" # e.g. "2020" for a static year
  # start_date: "" # use instead of date for a span
  # end_date: ""

# Data fields/Attributes (required)
dimensions:
  - name: ""
    type: ""
    description: ""
    values: []
    reference_system: "" # conditional, if a controlled vocabulary exists or key/value descriptions are needed

variables:
  - name: ""
    dimensions: []
    # Put the stable definition here. Add the normal reading rule here too when
    # direction matters.
    description: ""
    data_type: ""
    unit: ""
    # Put variable-specific limitations, caveats, or warnings here. Dataset-wide
    # limitations belong in the record-level `note` field.
    note: >
      ""

classes: # conditional, if classification scheme exists - must map to a listed variable
  - variable: ""
    values:
      - value:
        label: ""
        description: ""

# Additional fields for searching and filtering
cdh:
  domain: [climate] # Required - CDH-controlled vocabulary (vocab/domain.json)
  usage:
    not_recommended_for:
      - use: ""
        reason: ""
        use_instead: null

climate:
  mip_era: ""
  scenarios: []
  models: # use `ensemble` to indicate a multi-model ensemble
    - ""
  baseline:
    start_date: ""
    end_date: ""
  bias_adjustment:
    method: null
    reference_dataset: null
  downscaling:
    method: null
    resolution: null

commodities: [] # Required - CDH-controlled vocabulary (vocab/commodity.json)

# Data provenance / processing
# - `processing[]` is an ordered list of steps. When provided, at least one step
#   MUST use `id: source` and describe the original generation of the data.
processing:
  - id: source
    description:
    code:
      url:
      version:
    date:
    derived_from:
      - url: ""
        title: ""
        version: "" # the source release used, as the source labels it

# Data Urls (required)
data:
  - name: ""
    # Access locations for this asset. At least one is required. Add more
    # entries ONLY when they point at the SAME content via a different access
    # path (e.g., HTTPS and S3 URLs for the same file)
    #
    # Different content/formats (e.g., COG vs NetCDF) and services
    # queried rather than downloaded (e.g., a GEE collection) are SEPARATE
    # data entries, not extra locations here.
    locations:
      - url: ""
        title: "" # optional an access label (e.g., "HTTPS", "S3")
    # Optional: split one dataset into many files. With href_template, the
    # locations[].url above become base paths and this pattern is appended to
    # each. Tokens in {braces} must match a dimensions[].name; one file exists
    # per value combination. Omit for a single file.
    # href_template: "name_{dim_a}_{dim_b}.tif"
    processing_steps: [] # conditional, if processing metadata exists / steps are needed
    description: ""
    nodata: ""
    media_type: "" # provide if known
    file_size: "" # provide if known

additional_assets: # recommended - same guidelines as above data fields
  - name: ""
    locations:
      - url: ""
        title: ""
    description: ""
    media_type: ""
    roles: []
    file_size: ""

additional_links:
  - name: ""
    rel: ""
    url: ""
    description: ""
